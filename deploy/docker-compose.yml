services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    ports: ["8000:8000"]
    env_file: ../.env
  web:
    image: node:22-alpine
    working_dir: /app
    volumes: ["../web:/app"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
