services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    ports: ["8000:8000"]
    # Safe defaults support a fresh-clone fixture demo; .env may override locally.
    env_file:
      - path: ../.env.example
        required: true
      - path: ../.env
        required: false
  web:
    image: node:22-alpine
    working_dir: /app
    volumes: ["../web:/app"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
